name: Radar

# Só leitura. Confere, pela API da Meta (Business Discovery), as contas do Instagram de content/perfis_alvo.json
# e/ou mostra o texto que a Página do Facebook e o Instagram da TECHDIM exibem hoje. O resultado vai para
# registros/radar/ no branch assets. Não segue, não curte e não comenta: isso só uma pessoa faz, no app.

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        required: true
        type: choice
        options: [validar-lista, diagnostico]
        default: validar-lista
      lista:
        description: "Lista de contas (validar-lista); vazio = content/perfis_alvo.json"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: registro-assets
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Consultar e registrar
        env:
          PYTHONPATH: src
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          ACAO: ${{ inputs.acao }}
          LISTA: ${{ inputs.lista }}
        run: |
          set -uo pipefail
          git clone -q --depth 1 --branch assets \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/assets
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--dest /tmp/assets --acao "$ACAO")
          [ -n "$LISTA" ] && args+=(--lista "$LISTA")
          # com -e uma falha abortaria aqui e o resultado parcial nunca chegaria ao branch assets
          rc=0
          python src/radar.py "${args[@]}" || rc=$?
          cd /tmp/assets
          git add registros
          git commit -q -m "radar: $ACAO $(TZ=America/Sao_Paulo date +'%F %H:%M')" || exit $rc
          for i in 1 2 3 4; do
            if git pull -q --rebase origin assets && git push -q origin assets; then exit $rc; fi
            sleep $((i * 3))
          done
          echo "::error::não consegui gravar o registro"; exit 1
