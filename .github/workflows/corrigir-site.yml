name: Corrigir site

# Troca o endereço do site na legenda e no primeiro comentário dos posts já publicados
# (config.SITE_FORA_DO_AR -> config.SITE). A lista de posts vem do diário no branch assets.
#
# Começa em ENSAIO: só lê os posts no ar e mostra o que mudaria. Para editar, marque "aplicar".
# Cada edição guarda o texto original em registros/<dia>/correcao-site-*.jsonl e vira um
# movimento "editou" no diário; para voltar atrás, informe esse arquivo em "desfazer".
# Rodar de novo é seguro: o que já foi trocado aparece como "sem mudança".
# Não altera imagens (o endereço está desenhado nelas) e o Instagram pode recusar a edição de legenda.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Marque para editar de verdade (desmarcado = ensaio, só mostra o que mudaria)"
        type: boolean
        default: false
      redes:
        description: "Redes a corrigir, separadas por vírgula"
        type: string
        default: "linkedin,facebook,instagram"
      posts:
        description: "Só estes posts (rede:id separados por vírgula, ex.: facebook:123_456,linkedin:urn:li:share:7511); vazio = todos"
        type: string
        default: ""
      limite:
        description: "Máximo de posts a processar, do mais novo ao mais antigo (0 = todos)"
        type: string
        default: "0"
      desfazer:
        description: "Restaurar os textos originais de um backup (ex.: registros/2026-10-16/correcao-site-0030.jsonl); vazio = não desfaz"
        type: string
        default: ""
      perfis:
        description: "Em vez dos posts, conferir o site/descrição do perfil do Facebook e do Instagram (com 'aplicar', corrige o da Página)"
        type: boolean
        default: false
      limpar_site:
        description: "Com 'perfis' e 'aplicar': tenta deixar só o endereço novo no campo Site da Página (limpa e grava de novo)"
        type: boolean
        default: false
      graph:
        description: "Versão da Graph API para esta rodada (ex.: v26.0); vazio = a de config.py"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: registro-assets
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Corrigir e registrar
        env:
          PYTHONPATH: src
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_URN: ${{ vars.LINKEDIN_URN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          APLICAR: ${{ inputs.aplicar }}
          REDES: ${{ inputs.redes }}
          POSTS: ${{ inputs.posts }}
          LIMITE: ${{ inputs.limite }}
          DESFAZER: ${{ inputs.desfazer }}
          PERFIS: ${{ inputs.perfis }}
          LIMPAR_SITE: ${{ inputs.limpar_site }}
          GRAPH: ${{ inputs.graph }}
        run: |
          set -uo pipefail
          git clone -q --depth 1 --branch assets \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/assets
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--dest /tmp/assets --redes "$REDES")
          [ "$APLICAR" = "true" ] && args+=(--aplicar)
          [ -n "$POSTS" ] && args+=(--so "$POSTS")
          [ "$LIMITE" != "0" ] && args+=(--limite "$LIMITE")
          [ -n "$DESFAZER" ] && args+=(--desfazer "$DESFAZER")
          [ "$PERFIS" = "true" ] && args+=(--perfis)
          [ "$LIMPAR_SITE" = "true" ] && args+=(--limpar-site)
          [ -n "$GRAPH" ] && args+=(--graph-versao "$GRAPH")
          # o shell do Actions roda com -e: sem o "|| rc=$?" uma falha abortaria aqui e o backup e o diário
          # da rodada nunca chegariam ao branch assets
          rc=0
          python src/corrigir_site.py "${args[@]}" || rc=$?
          cd /tmp/assets
          git add registros
          git commit -q -m "corrigir site: $(TZ=America/Sao_Paulo date +'%F %H:%M')" || exit $rc
          for i in 1 2 3 4; do
            if git pull -q --rebase origin assets && git push -q origin assets; then exit $rc; fi
            sleep $((i * 3))
          done
          echo "::error::não consegui gravar o registro"; exit 1
