name: Apagar posts

# Apaga posts nas redes e registra cada exclusão no diário do dia.
# Irreversível: só dispara à mão.

on:
  workflow_dispatch:
    inputs:
      posts:
        description: "rede:id separados por vírgula (ex.: facebook:123_456,instagram:1789,linkedin:urn:li:share:7511)"
        required: true
        type: string
      motivo:
        description: "Por que está sendo apagado"
        required: true
        type: string
        default: "post de teste"

permissions:
  contents: write

concurrency:
  group: registro-assets
  cancel-in-progress: false

jobs:
  apagar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apagar e registrar
        env:
          PYTHONPATH: src
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          POSTS: ${{ inputs.posts }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          set -uo pipefail
          git clone -q --depth 1 --branch assets \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/assets
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python src/apagar.py --dest /tmp/assets --posts "$POSTS" --motivo "$MOTIVO"
          rc=$?
          cd /tmp/assets
          git add registros
          git commit -q -m "apagou: $(TZ=America/Sao_Paulo date +'%F %H:%M')" || exit $rc
          for i in 1 2 3 4; do
            if git pull -q --rebase origin assets && git push -q origin assets; then exit $rc; fi
            sleep $((i * 3))
          done
          echo "::error::não consegui gravar o registro"; exit 1
