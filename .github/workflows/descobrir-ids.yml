name: Descobrir IDs

# Rode uma vez, manualmente, depois de cadastrar o META_ACCESS_TOKEN.
# Imprime o FB_PAGE_ID e o IG_USER_ID para você colar nas Variables.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descobrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          PYTHONPATH: src
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python src/discover.py
      - name: LinkedIn
        env:
          PYTHONPATH: src
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python src/linkedin_ids.py
