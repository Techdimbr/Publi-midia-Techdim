name: Métricas do dia

# Uma foto por dia das contas e dos Stories, gravada em
# registros/AAAA-MM-DD/metricas.json e acumulada em registros/seguidores.csv.
#
# Por que não deixar isso para o relatório de segunda-feira:
#   · a API da Meta guarda as métricas de Story por apenas 24 horas;
#   · o número de seguidores é um retrato do instante — sem uma foto por dia
#     não existe curva de crescimento, que é a meta principal da conta hoje.
#
# 00:03 UTC = 21:03 de Brasília. O agendador do GitHub atrasa até ~3 h, e mesmo
# no pior caso (≈23h50 de Brasília) a coleta ainda cai no mesmo dia local — que
# é o que faz os Stories do dia ainda estarem no ar.

on:
  schedule:
    - cron: "3 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar a pasta de registros
        run: |
          git clone -q --depth 1 --branch assets \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/assets

      - name: Coletar
        env:
          PYTHONPATH: src
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python src/metricas_dia.py --dest /tmp/assets

      - name: Gravar no branch assets
        run: |
          set -euo pipefail
          cd /tmp/assets
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registros
          git commit -q -m "métricas do dia $(TZ=America/Sao_Paulo date +%F)" || { echo "sem mudanças"; exit 0; }
          for i in 1 2 3 4; do
            if git pull -q --rebase origin assets && git push -q origin assets; then
              echo "https://github.com/${{ github.repository }}/blob/assets/registros/seguidores.csv" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "::error::não consegui gravar as métricas"
          exit 1
