name: Pauta do Dia (Gemini Spark)

# Geração automática da pauta diária escrita pelo Gemini (src/pauta_reserva.py).
#
# Roda todo dia às 07:03 BRT (10:03 UTC) como provedor oficial de pautas,
# pesquisando feeds RSS e criando content/diario/AAAA-MM-DD/ com os 4 temas do dia.
# Também pode ser disparado manualmente via workflow_dispatch para ensaio ou regeração.
#
# Sem o segredo GEMINI_API_KEY (Settings > Secrets and variables > Actions) ele não faz nada.
# Chave grátis: https://aistudio.google.com/apikey

on:
  schedule:
    - cron: "3 10 * * *"   # 07:03 BRT (UTC-3), geração diária automática
  workflow_dispatch:
    inputs:
      dia:
        description: "AAAA-MM-DD (vazio = hoje, em Brasília)"
        type: string
        default: ""
      temas:
        description: "Temas separados por vírgula: noticias, hacker, dica, servico (vazio = os que faltam ou reprovam)"
        type: string
        default: ""
      gravar:
        description: "Grava as pautas em content/diario/ e envia ao main (desmarcado = ensaio: só mostra no log)"
        type: boolean
        default: false
      forcar:
        description: "Gera mesmo com a pauta do dia de pé (exige 'temas'; com 'gravar' SOBRESCREVE o arquivo)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pauta-reserva
  cancel-in-progress: false

jobs:
  reserva:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar a pauta de reserva
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DIA: ${{ inputs.dia }}
          TEMAS: ${{ inputs.temas }}
          GRAVAR: ${{ inputs.gravar }}
          FORCAR: ${{ inputs.forcar }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "$EVENTO" = "schedule" ]; then
            GRAVAR="true"
          fi
          if [ "$FORCAR" = "true" ] && [ -z "$TEMAS" ]; then
            echo "::error::'forcar' exige informar os temas"; exit 1
          fi
          args=()
          [ -n "$DIA" ] && args+=(--dia "$DIA")
          for t in ${TEMAS//,/ }; do args+=(--tema "$t"); done
          [ "$FORCAR" = "true" ] && args+=(--forcar)
          [ "$GRAVAR" = "true" ] && args+=(--gravar)
          rc=0
          python src/pauta_reserva.py "${args[@]}" || rc=$?
          if [ -n "$(git status --porcelain content/diario)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/diario
            git commit -q -m "pauta do dia (Gemini Spark): $(TZ=America/Sao_Paulo date +%F)"
            for i in 1 2 3 4; do
              if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit $rc; fi
              sleep $((i * 3))
            done
            echo "::error::não consegui enviar a pauta de reserva ao main"; exit 1
          fi
          exit $rc
